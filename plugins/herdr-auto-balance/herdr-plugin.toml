id = "builtbywin.herdr-auto-balance"
name = "Herdr Auto Balance"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Runs herdr-balance-panes whenever a pane is created or closed."
platforms = ["macos", "linux"]

[[events]]
on = "pane.created"
command = ["sh", "-c", "exec \"$HOME/.local/bin/herdr-balance-panes\""]

[[events]]
on = "pane.closed"
command = ["sh", "-c", "exec \"$HOME/.local/bin/herdr-balance-panes\""]
