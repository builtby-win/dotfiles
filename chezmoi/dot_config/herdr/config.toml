# =============================================================================
# builtby.win herdr config
# Keybindings aligned with tmux builtby/basic.conf
# =============================================================================

onboarding = false

[theme]
name = "catppuccin"

[ui]
# Show a zoom indicator in the tab bar so a zoomed pane is not mistaken for the only pane.
tab_bar_right = [{ type = "zoom" }]
# Collapsed sidebar takes zero width (no dots rail). "compact" keeps the rail.
sidebar_collapsed_mode = "hidden"

[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

[terminal]
# Render pane images in Kitty graphics-compatible outer terminals (Ghostty).
# omp requires this AND PI_FORCE_IMAGE_PROTOCOL=kitty: without it omp's
# resolveImageProtocol() returns null inside Herdr (imagesRequireOverride).
kitty_graphics = true

[keys]
prefix = "ctrl+b"

# --- Tab/window (matches tmux window binds) ---
new_tab = "prefix+t"
previous_tab = "prefix+q"
next_tab = "prefix+e"
switch_tab = "prefix+1..9"
switch_workspace = "cmd+1..9"
previous_workspace = ["prefix+[", "prefix+up"]
next_workspace = ["prefix+]", "prefix+down"]
close_tab = "prefix+shift+x"

# --- Pane splits (matches tmux and Ghostty: d=right, Shift+D=down) ---
split_vertical = "prefix+d"
split_horizontal = "prefix+shift+d"

# --- Pane navigation (matches tmux leader+hjkl and Alt+hjkl) ---
focus_pane_left = ["prefix+h", "prefix+left", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "prefix+right", "alt+l"]

# --- Pane management ---
# Panes are closed safely via confirmation popup modal bound to prefix+w and prefix+x below.
close_pane = []
# Return to the previously focused pane (last active workspace).
# cycle_pane_next defaults to prefix+tab, so unbind it to keep leader+tab unambiguous.
cycle_pane_next = []
last_pane = "prefix+tab"
zoom = "prefix+z"
swap_pane_down = "prefix+>"
swap_pane_up = "prefix+<"

# --- Copy mode (tmux: prefix+v and prefix+u) ---
copy_mode = ["prefix+v", "prefix+u"]

# --- Session/detach (tmux: uppercase Q) ---
detach = "prefix+shift+q"

# --- Config reload (tmux: prefix+r) ---
reload_config = "prefix+r"

# --- Displaced defaults (actions whose default key was reassigned above) ---
# resize_mode was prefix+r, moved to prefix+shift+r
resize_mode = "prefix+shift+r"
# edit_scrollback was prefix+e, moved to prefix+shift+e
edit_scrollback = "prefix+shift+e"

# --- Herdr-native ---
# Create a plain workspace.
new_workspace = "prefix+shift+n"
# Create and open a Git worktree.
new_worktree = "prefix+n"
# Close a non-worktree workspace without deleting its checkout.
close_workspace = "prefix+shift+w"
# Searchable workspace/tab/pane tree (press / to fuzzy-filter).
# Only matches the visible label, so prefix+space runs herdr-switch instead.
goto = "prefix+f"
# Built-in navigate-mode picker is unbound: it is too cramped on small/phone
# screens and can't show repo/branch/path. prefix+g opens the herdr-switch
# popup instead (workspaces first, up wraps to the + new / tools… row).
workspace_picker = ""
navigate_workspace_down = ["j", "down"]
navigate_workspace_up = ["k", "up"]
navigate_pane_down = ["ctrl+j", "ctrl+down"]
navigate_pane_up = ["ctrl+k", "ctrl+up"]
help = "prefix+?"
settings = "prefix+s"
toggle_sidebar = "prefix+shift+b"

# Fuzzy switch on label, repo/folder, branch and path.
# prefix+g mirrors prefix+space so the cramped built-in picker isn't needed.
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "herdr-switch"
description = "switch workspace"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "herdr-switch"
description = "switch workspace"
width = "80%"
height = "80%"

# Equalize pane sizes in the focused tab.
[[keys.command]]
key = "prefix+b"
type = "shell"
command = "herdr-balance-panes"
description = "balance panes"

# --- Lazygit (zoomed pane) ---
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"
description = "lazygit"

# Confirmation popup modal before closing a pane (prevents accidental kill of active agents/shells).
[[keys.command]]
key = "prefix+w"
type = "popup"
command = "herdr-confirm-close-pane"
description = "confirm close pane"
width = 50
height = 8

[[keys.command]]
key = "prefix+x"
type = "popup"
command = "herdr-confirm-close-pane"
description = "confirm close pane"
width = 50
height = 8

# --- herdr-nvim (nvim sidebar + file picker) ---
[[keys.command]]
key = "prefix+m"
type = "shell"
command = "herdr-plugin-action chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "herdr-plugin-action chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
