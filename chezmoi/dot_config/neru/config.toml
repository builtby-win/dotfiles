[general]
passthrough_unbounded_keys = true
should_exit_after_passthrough = false

[hotkeys]
"Primary+Shift+Space" = "__disabled__"
"Primary+Shift+G" = "__disabled__"
"Primary+Shift+C" = "__disabled__"
"Primary+Shift+S" = "__disabled__"
"Cmd+Ctrl+Alt+Shift+K" = "grid --cursor-selection-mode follow"
"Cmd+Ctrl+Alt+Shift+S" = ["exec ~/.local/bin/karabiner-layer scroll", "scroll"]
"Cmd+Ctrl+Alt+Shift+F" = "hints"
"Cmd+Ctrl+Alt+Shift+L" = "hints"
"Cmd+Ctrl+Alt+Shift+Space" = "__disabled__"
"Cmd+Ctrl+Alt+Shift+j" = "recursive_grid --cursor-selection-mode follow"
"Cmd+Ctrl+Alt+Shift+n" = "recursive_grid --cursor-selection-mode follow"
"Cmd+Ctrl+Alt+Shift+;" = "recursive_grid --cursor-selection-mode follow"
"Cmd+Ctrl+Alt+Shift+'" = "grid --cursor-selection-mode follow"

[theme.light]
surface = "#EEF2FF"
accent = "#465FBC"
accent_alt = "#0B2377"
on_accent_alt = "#F8FAFF"
text = "#17327A"

[theme.dark]
surface = "#0A1338"
accent = "#6E82D6"
accent_alt = "#8FA2F0"
on_accent_alt = "#081022"
text = "#E8EEFF"

[hints]
hint_characters = "asdfghjkl"
parallel_threshold = 20
detect_mission_control = false

[hints.hotkeys]
# Every path that ends in `idle` also resets the Karabiner mode so the
# fj/dk/jl/df chord doesn't leave normal remaps disabled. Neru has no
# global on-idle hook, so we have to do this per binding.
"Escape" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"Backspace" = "action backspace"
"Return" = ["action left_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+L" = ["action left_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+R" = ["action right_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+Return" = "action left_click"

[hints.additional_ax_support]
enable = true
additional_electron_bundles = []
additional_chromium_bundles = []
additional_firefox_bundles = []

[grid]
characters = "ertyufghjkcvbnmd"
sublayer_keys = "rtyfghvbn"
prewarm_enabled = true
live_match_update = true
hide_unmatched = true

[grid.hotkeys]
# Drag (stateless — 1=mouse_down, 2=mouse_up, no auto-exit)
"1" = "action mouse_down"
"2" = "action mouse_up"
# Click actions (unified with recursive_grid)
"Space" = ["action left_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+Space" = ["action right_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+M" = ["action middle_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Return" = ["action left_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+Return" = ["action middle_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
# Mode navigation
"s" = ["exec ~/.local/bin/karabiner-layer scroll", "scroll"]
"." = ["exec ~/.local/bin/karabiner-layer scroll", "scroll"]
# Mode exits
"," = "action reset"
"'" = "action reset"
"Escape" = ["exec ~/.local/bin/karabiner-layer off", "idle"]

[recursive_grid]
grid_cols = 4
grid_rows = 4
# Compact 4x4 home-area layout for faster muscle memory:
#   e r t y
#   u i f g
#   h j k c
#   v b n m
keys = "ertyuifghjkcvbnm"
min_size_width = 1
min_size_height = 1
max_depth = 10

[recursive_grid.hotkeys]
# Drag (stateless — 1=mouse_down, 2=mouse_up, unified with grid)
"1" = "action mouse_down"
"2" = "action mouse_up"
# Click actions (unified with grid)
"Space" = ["action left_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+Space" = ["action right_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+M" = ["action middle_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Return" = ["action left_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+Return" = ["action middle_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
# Mode navigation (grid-specific)
"Tab" = "exec ~/.local/bin/karabiner-layer nudge"
"s" = ["exec ~/.local/bin/karabiner-layer scroll", "scroll"]
"." = ["exec ~/.local/bin/karabiner-layer scroll", "scroll"]
"`" = "toggle-cursor-follow-selection"
"Up" = "action move_mouse_relative --dx=0 --dy=-5"
"Down" = "action move_mouse_relative --dx=0 --dy=5"
"Left" = "action move_mouse_relative --dx=-5 --dy=0"
"Right" = "action move_mouse_relative --dx=5 --dy=0"
"Backspace" = "action backspace"
# Mode exits (unified with grid)
"'" = "action reset"
"Escape" = ["exec ~/.local/bin/karabiner-layer off", "idle"]

[recursive_grid.animation]
enabled = false

[recursive_grid.ui]
label_background = true
label_background_color = "#F8FFF7B8"
label_background_padding_x = 5
label_background_padding_y = 3
label_background_border_radius = 4
label_background_border_width = 0
sub_key_preview = false
sub_key_preview_autohide_multiplier = 1.0
font_size = 18
text_color = "#FF111111"
line_color = "#CC465FBC"
highlight_color = "#11FFFFFF"

[scroll]
scroll_step = 40
scroll_step_half = 500

[scroll.hotkeys]
"Escape" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"k" = "action scroll_up"
"j" = "action scroll_down"
"h" = "action scroll_left"
"l" = "action scroll_right"
"gg" = "action go_top"
"Shift+G" = "action go_bottom"
"u" = "action page_up"
"PageUp" = "action page_up"
"d" = "action page_down"
"PageDown" = "action page_down"
"Shift+L" = ["action left_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+R" = ["action right_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+M" = ["action middle_click", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+I" = ["action mouse_down", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Shift+U" = ["action mouse_up", "exec ~/.local/bin/karabiner-layer off", "idle"]
"Up" = "action move_mouse_relative --dx=0 --dy=-10"
"Down" = "action move_mouse_relative --dx=0 --dy=10"
"Left" = "action move_mouse_relative --dx=-10 --dy=0"
"Right" = "action move_mouse_relative --dx=10 --dy=0"
"a" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"b" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"c" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"e" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"f" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"i" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"m" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"n" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"o" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"p" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"q" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"r" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"s" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"t" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"v" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
