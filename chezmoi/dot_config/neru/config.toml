[general]
passthrough_unbounded_keys = true
should_exit_after_passthrough = false

[hotkeys]
"Primary+Shift+Space" = "__disabled__"
"Primary+Shift+G" = "__disabled__"
"Primary+Shift+C" = "__disabled__"
"Primary+Shift+S" = "__disabled__"
"Cmd+Ctrl+Alt+Shift+K" = ["exec ~/.local/bin/kanata-layer neruscroll", "scroll"]
"Cmd+Ctrl+Alt+Shift+F" = "hints"
"Cmd+Ctrl+Alt+Shift+L" = "hints"
"Cmd+Ctrl+Alt+Shift+Space" = "recursive_grid --cursor-selection-mode follow"
"Cmd+Ctrl+Alt+Shift+j" = "recursive_grid --cursor-selection-mode follow"
"Cmd+Ctrl+Alt+Shift+n" = "recursive_grid --cursor-selection-mode follow"
"Cmd+Ctrl+Alt+Shift+;" = "recursive_grid --cursor-selection-mode follow"
"Cmd+Ctrl+Alt+Shift+'" = "grid --cursor-selection-mode follow"

[theme.light]
surface = "#EEF2FF"
accent = "#465FBC"
accent_alt = "#0B2377"
on_accent_alt = "#F8FAFF"
text = "#17327A"

[theme.dark]
surface = "#0A1338"
accent = "#6E82D6"
accent_alt = "#8FA2F0"
on_accent_alt = "#081022"
text = "#E8EEFF"

[hints]
hint_characters = "asdfghjkl"
parallel_threshold = 20
detect_mission_control = false

[hints.hotkeys]
# Every path that ends in `idle` also resets the Kanata layer so the
# fj/dk/jl/df chord doesn't leave us stuck in `nerumode`. Neru has no
# global on-idle hook, so we have to do this per binding.
"Escape" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"Backspace" = "action backspace"
"Return" = ["action left_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+L" = ["action left_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+R" = ["action right_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+Return" = "action left_click"

[hints.additional_ax_support]
enable = true
additional_electron_bundles = []
additional_chromium_bundles = []
additional_firefox_bundles = []

[grid]
prewarm_enabled = true
live_match_update = true
hide_unmatched = true

[grid.hotkeys]
"," = "action reset"
"'" = "action reset"
"Escape" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"Return" = ["action left_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+Return" = "action left_click"

[recursive_grid]
grid_cols = 5
grid_rows = 3
# Compact 5x3 home-area layout for faster muscle memory:
#   r t y u i
#   f g h j k
#   v b n m ,
keys = "rtyuifghjkvbnm,"
min_size_width = 1
min_size_height = 1
max_depth = 10

[recursive_grid.hotkeys]
# Every path that ends in `idle` also resets the Kanata layer so the
# fj/dk/jl/df chord doesn't leave us stuck in `nerumode`. Neru has no
# global on-idle hook, so we have to do this per binding.
# The 5x5 grid uses most letters, so mode commands intentionally live on
# non-grid keys to avoid stealing selection cells. `Tab` enters the Kanata
# nerunudge layer where h/j/k/l → arrow keys for the 5px nudges below.
# `.` enters scroll mode. Backspace backs up one recursive-grid depth.
"Tab" = "exec ~/.local/bin/kanata-layer nerunudge"
"Space" = ["action left_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+Space" = ["action right_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Return" = ["action left_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+Return" = ["action middle_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+M" = ["action middle_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"s" = ["exec ~/.local/bin/kanata-layer neruscroll", "scroll"]
"." = ["exec ~/.local/bin/kanata-layer neruscroll", "scroll"]
"`" = "toggle-cursor-follow-selection"
"Up" = "action move_mouse_relative --dx=0 --dy=-5"
"Down" = "action move_mouse_relative --dx=0 --dy=5"
"Left" = "action move_mouse_relative --dx=-5 --dy=0"
"Right" = "action move_mouse_relative --dx=5 --dy=0"
"Escape" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"Backspace" = "action backspace"
"'" = "action reset"

[recursive_grid.animation]
enabled = false

[recursive_grid.ui]
label_background = false
sub_key_preview = false
sub_key_preview_autohide_multiplier = 1.0
text_color = "#99000000"
line_color = "#33000000"
highlight_color = "#11FFFFFF"

[scroll]
scroll_step = 40
scroll_step_half = 500

[scroll.hotkeys]
"Escape" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"k" = "action scroll_up"
"j" = "action scroll_down"
"h" = "action scroll_left"
"l" = "action scroll_right"
"gg" = "action go_top"
"Shift+G" = "action go_bottom"
"u" = "action page_up"
"PageUp" = "action page_up"
"d" = "action page_down"
"PageDown" = "action page_down"
"Shift+L" = ["action left_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+R" = ["action right_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+M" = ["action middle_click", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+I" = ["action mouse_down", "exec ~/.local/bin/kanata-layer base", "idle"]
"Shift+U" = ["action mouse_up", "exec ~/.local/bin/kanata-layer base", "idle"]
"Up" = "action move_mouse_relative --dx=0 --dy=-10"
"Down" = "action move_mouse_relative --dx=0 --dy=10"
"Left" = "action move_mouse_relative --dx=-10 --dy=0"
"Right" = "action move_mouse_relative --dx=10 --dy=0"
"a" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"b" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"c" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"e" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"f" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"i" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"m" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"n" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"o" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"p" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"q" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"r" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"s" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"t" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"v" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"w" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"x" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"y" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"z" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"0" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"1" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"2" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"3" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"4" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"5" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"6" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"7" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"8" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"9" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"Return" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"Tab" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"Space" = ["exec ~/.local/bin/kanata-layer base", "idle"]
"Backspace" = ["exec ~/.local/bin/kanata-layer base", "idle"]

[mode_indicator.scroll]
enabled = true
text = "Scroll"

[mode_indicator.hints]
enabled = true
text = "Hints"

[mode_indicator.grid]
enabled = true
text = "Grid"

[mode_indicator.recursive_grid]
enabled = true
text = "Recursive"

[virtual_pointer]
enabled = false

[virtual_pointer.ui]
size = 3
color = "#FFFF00CC"

[smooth_cursor]
move_mouse_enabled = true
steps = 12
max_duration = 180
duration_per_pixel = 0.12
