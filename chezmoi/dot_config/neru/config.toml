"y" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"z" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"0" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"1" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"2" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
"3" = ["exec ~/.local/bin/karabiner-layer off", "idle"]
