# mimi (https://github.com/y3owk1n/mimi) -> ~/.config/mimi/config.toml
# Native Spaces + Hyprland-style dwindle tiling, SIP left on. Driven by the jk
# leader (chezmoi/dot_hammerspoon/modules/leader.lua), which shells out to
# `mimi action ...` and `mimi tiling cmd ...`.
#
# Create the Spaces once in Mission Control (leader 1..0 jumps to Space N), and
# turn off System Settings > Desktop & Dock > "Automatically rearrange Spaces
# based on most recent use" so the numbers stay put.

[systray]
enabled = true
show_workspace_number = false  # Hammerspoon's menu bar item lists the Spaces instead

# The active-window ring.
[border]
enabled = true
width = 4
placement = "outside"
active_color = "#8b5cf6"
inactive_color = "#313244"

[tiling]
enabled = true
layout = "~/.config/mimi/tiling/bsp.py"
layout_mode = "resident"       # keeps the layout process warm between passes
relayout_on_drag = true        # drag an edge to resize a split, drop on a window to swap
gap = 8

[tiling.animation]
enabled = false

# Allowlist: only terminals and browsers tile. Every other window floats and
# behaves like a normal macOS window. Rules are read in order and the last match
# wins, so the catch-all comes first and the allowed apps take their windows back.
[[tiling.rules]]
app = "*"
manage = false

# Terminals
[[tiling.rules]]
bundle_id = "com.mitchellh.ghostty"
manage = true

[[tiling.rules]]
bundle_id = "com.googlecode.iterm2"
manage = true

[[tiling.rules]]
bundle_id = "com.apple.Terminal"
manage = true

[[tiling.rules]]
bundle_id = "dev.warp.Warp-Stable"
manage = true

[[tiling.rules]]
bundle_id = "net.kovidgoyal.kitty"
manage = true

[[tiling.rules]]
bundle_id = "org.alacritty"
manage = true

[[tiling.rules]]
bundle_id = "io.alacritty"
manage = true

[[tiling.rules]]
bundle_id = "com.github.wez.wezterm"
manage = true

[[tiling.rules]]
bundle_id = "com.cmuxterm.app"
manage = true

[[tiling.rules]]
bundle_id = "com.kk2.rootshell"
