# Linux keyboard layer for the Microsoft Sculpt (2.4GHz dongle, 045e:07a5).
# macOS uses Karabiner Elements (chezmoi/dot_config/karabiner), Windows uses windows/kanata.kbd.
# Install: ./scripts/setup-linux-desktop.sh (copies this to /etc/keyd/default.conf).
#
# Panic exit if the keyboard ever misbehaves: Backspace + Escape + Enter stops keyd.
# Find key names / device ids with: sudo keyd monitor

[ids]
045e:07a5

[global]
# Same 120ms window as the Karabiner jk chord.
chord_timeout = 120
# An armed (tapped) Hyper gives up if the next key never comes.
oneshot_timeout = 1500

[main]
# Mac layout: Alt-position key = Cmd (Super), Win-position key = Option (Alt),
# right Alt = Cmd. Hyprland sees Cmd as SUPER and Option as ALT.
leftalt = layer(meta)
leftmeta = layer(alt)
rightalt = layer(meta)

# Menu key (right side, between Alt and Ctrl): hold = Hyper, tap = Hyper for the next key.
# Hyper = Ctrl+Alt+Shift+Super. Both names are bound because the Sculpt's Application key
# is KEY_COMPOSE on Linux, while some keyboards send KEY_MENU.
compose = overloadt(hyper, oneshot(hyper), 200)
menu = overloadt(hyper, oneshot(hyper), 200)

# Caps Lock: Escape when tapped, Control when held.
capslock = overload(control, esc)

# jk chord is the window leader: Hyper+F13, which Hyprland turns into the "leader"
# submap (linux/hypr/leader.lua). Pressing jk twice sends Ctrl+B to the focused
# window, i.e. the herdr / tmux prefix.
j+k = C-A-S-M-f13

[hyper:C-A-S-M]
